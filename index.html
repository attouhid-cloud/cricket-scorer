<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>টিম পোস্টার মেকার</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;font-family:'Hind Siliguri',sans-serif;color:#fff}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px;background:#111936;border-bottom:1px solid #2a3566}
.bar button{font:600 15px 'Hind Siliguri',sans-serif;padding:9px 14px;border:0;border-radius:10px;background:#ffd21f;color:#1a1a1a}
.bar button.g{background:#2a3566;color:#fff}
.hint{text-align:center;font-size:13px;color:#9fb0e8;padding:6px 10px}
#wrap{margin:0 auto;overflow:hidden}
#stage{width:1080px;transform-origin:top left;padding:50px 40px 40px;text-align:center;
 background:radial-gradient(circle at 20% 10%,#1a2a6c 0,#0a1038 45%,#050a24 100%);font-family:'Hind Siliguri',sans-serif}
[contenteditable]{outline:none;cursor:text}
[contenteditable]:hover{background:rgba(255,255,255,.08)}
.exp [contenteditable]:hover{background:none}
.club{font-size:76px;font-weight:700;color:#ffd21f;line-height:1.2;text-shadow:0 0 18px rgba(255,210,31,.35)}
.by{font-size:42px;font-weight:600;line-height:1.3}
.pill{margin:14px auto;border:6px solid #ffc933;border-radius:50px}
.t1{background:#a00016;width:94%;font-size:74px;font-weight:700;padding:0 20px;line-height:1.5}
.tag{font-size:40px;font-weight:600;color:#d7ffb8;margin:18px 0 4px}
.t2{background:#2a0508;width:86%;font-size:84px;font-weight:700;color:#ffd21f;padding:0 20px;line-height:1.5}
.mgr{font-size:46px;font-weight:600;margin:14px 0 26px}
.mgr b{color:#ffd21f;margin-left:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{border:5px solid #ffc933;border-radius:22px;padding:8px;background:rgba(255,201,51,.12)}
.ph{position:relative;height:400px;border-radius:10px;overflow:hidden;background:#16245c center/cover no-repeat;border:3px solid #ffc933;
 display:flex;align-items:center;justify-content:center;font-size:30px;color:#9fb0e8;cursor:pointer}
.nm{margin-top:8px;background:#0b1670;border:3px solid #ffc933;border-radius:12px;font-size:42px;font-weight:700;padding:4px 6px;line-height:1.4}
.foot{margin-top:30px;font-size:44px;font-weight:700;color:#ffd21f}
.modal{display:none;position:fixed;inset:0;z-index:20;background:rgba(5,8,25,.96);overflow:auto;padding:14px;text-align:center}
.modal.on{display:block}
.modal select,.modal button{font:600 15px 'Hind Siliguri',sans-serif;padding:9px 12px;border-radius:10px;border:0;margin:4px}
.chk{display:inline-block;max-width:100%;margin-top:8px;background:repeating-conic-gradient(#3a3f55 0 25%,#2a2e42 0 50%) 0 0/24px 24px}
.chk img{max-width:100%;display:block}
.live{max-width:560px;margin:10px auto;padding:10px;border:1px solid #2a3566;border-radius:12px;background:#111936}
.live input{width:100%;margin:4px 0;padding:9px;border-radius:8px;border:1px solid #2a3566;background:#0b1020;color:#fff;font:14px sans-serif}
#fmsg{font-size:13px;color:#ffd21f;min-height:18px}
html.ovm,html.ovm body{background:transparent!important;overflow:hidden}
html.ovm .bar,html.ovm .hint,html.ovm #wrap,html.ovm .modal{display:none!important}
#ovroot{display:none;position:fixed;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;opacity:0;transition:opacity .4s}
</style>
</head>
<body>
<div class="bar">
  <button onclick="addP()">+ খেলোয়াড়</button>
  <button class="g" onclick="delP()">− খেলোয়াড়</button>
  <button onclick="dl()">⬇ ছবি ডাউনলোড</button>
  <button class="g" onclick="openOv()">🎬 Prism ওভারলে</button>
</div>
<div class="hint">যেকোনো লেখায় ট্যাপ করে বদলান • ছবির ঘরে ট্যাপ করে ফটো দিন</div>
<div id="wrap"><div id="stage">
  <div class="club" contenteditable="true">লোটন ফাইটার্স ক্লাবের</div>
  <div class="by" contenteditable="true">আয়োজনে</div>
  <div class="pill t1" contenteditable="true">নাইট ক্রিকেট টুর্নামেন্ট</div>
  <div class="tag" contenteditable="true">মাঠ মাতাতে আসছে দল</div>
  <div class="pill t2" contenteditable="true">সান মুন একাদশ</div>
  <div class="mgr"><span contenteditable="true">টিম ম্যানেজার</span><b contenteditable="true">Sun</b></div>
  <div class="grid" id="grid"></div>
  <div class="foot" contenteditable="true">সান মুন একাদশ</div>
</div></div>
<div class="modal" id="modal"><div>
  <select id="omode" onchange="ovSel()"><option value="team">পুরো টিম (সব প্লেয়ার)</option><option value="one">একজন প্লেয়ার</option></select>
  <select id="oplayer" style="display:none" onchange="mkOv()"></select>
  <button style="background:#ffd21f" onclick="mkOv()">তৈরি করুন</button>
  <button style="background:#ffd21f" onclick="dlOv()">⬇ PNG</button>
  <button style="background:#2a3566;color:#fff" onclick="closeOv()">বন্ধ</button>
  <div class="hint">১৯২০×১০৮০ স্বচ্ছ ব্যাকগ্রাউন্ড PNG • Prism Live-এ Image source হিসেবে যোগ করুন</div>
  <div class="live">
    <b style="font-size:15px">☁ Firebase লাইভ লিংক</b>
    <input id="fdb" placeholder="Firebase Database URL (https://xxxx.firebasedatabase.app)">
    <input id="froom" placeholder="Room ID (যেমন team-sunmoon)">
    <button style="background:#ffd21f" onclick="pushData()">☁ ডেটা সিঙ্ক</button>
    <button style="background:#2fb36b;color:#fff" onclick="showLive(true)">▶ দেখান</button>
    <button style="background:#c0392b;color:#fff" onclick="showLive(false)">⏹ লুকান</button>
    <button style="background:#2a3566;color:#fff" onclick="copyLink()">🔗 লিংক কপি</button>
    <input id="flink" readonly placeholder="ওভারলে লিংক এখানে আসবে">
    <div id="fmsg"></div>
  </div>
  <div class="chk"><img id="oimg"></div>
</div></div>
<div id="ovroot"></div>
<script>
const grid=document.getElementById('grid'),stage=document.getElementById('stage'),wrap=document.getElementById('wrap');
const names=['Sun','Moon','Sujon','Manik','Kamrul','Riyaz','Rubel','Chan','Noman'];
function num(){[...grid.children].forEach((c,i)=>c.querySelector('.n').textContent=(i+1)+'. ')}
function addP(name){
  const c=document.createElement('div');c.className='card';
  c.innerHTML='<div class="ph"><span class="lb">+ ছবি</span><input type="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px"></div><div class="nm"><span class="n"></span><span class="v" contenteditable="true"></span></div>';
  c.querySelector('.v').textContent=typeof name==='string'?name:'নাম';
  c.querySelector('input').onchange=function(){pick(this)};
  grid.appendChild(c);num();fit();
}
function delP(){if(grid.lastChild){grid.removeChild(grid.lastChild);fit()}}
function pick(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const ph=inp.parentNode,url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    const m=700,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    ph.style.backgroundImage='url('+c.toDataURL('image/jpeg',.85)+')';ph._src=c.toDataURL('image/jpeg',.85);
    const lb=ph.querySelector('.lb');if(lb)lb.remove();
    URL.revokeObjectURL(url);inp.value='';
  };
  im.onerror=()=>alert('ছবিটা লোড হয়নি, অন্য ছবি দিন');
  im.src=url;
}
function fit(){
  const s=Math.min(1,(window.innerWidth-16)/1080);
  stage.style.transform='scale('+s+')';
  wrap.style.width=(1080*s)+'px';
  wrap.style.height=(stage.offsetHeight*s)+'px';
}
function dl(){
  html2canvas(stage,{scale:2,useCORS:true,onclone:d=>{
    const s=d.getElementById('stage');s.style.transform='none';d.body.classList.add('exp');
    d.querySelectorAll('.ph').forEach(p=>{if(!p.style.backgroundImage)p.querySelector('.lb').textContent=''});
  }}).then(c=>c.toBlob(b=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='team-poster.png';a.click();
  }));
}

const esc=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function openOv(){
  const sel=document.getElementById('oplayer');
  sel.innerHTML=[...grid.children].map((c,i)=>'<option value="'+i+'">'+(i+1)+'. '+esc(c.querySelector('.v').textContent)+'</option>').join('');
  loadSaved();document.getElementById('modal').classList.add('on');mkOv();
}
function closeOv(){document.getElementById('modal').classList.remove('on')}
function ovSel(){document.getElementById('oplayer').style.display=document.getElementById('omode').value==='one'?'':'none';mkOv()}
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search),OVM=Q.get('o');
function getData(){return{t:stage.querySelector('.t2').textContent.trim(),m:stage.querySelector('.mgr b').textContent.trim(),lab:stage.querySelector('.mgr span').textContent.trim(),ps:[...grid.children].map(c=>({n:c.querySelector('.v').textContent.trim(),i:c.querySelector('.ph')._src||''}))}}
function ovHtml(d,mode,k){
  const t=esc(d.t),m=esc(d.m),lab=esc(d.lab),ps=(d.ps||[]).map(p=>({n:esc(p.n),i:p.i}));
  const ff="font-family:'Hind Siliguri',sans-serif;";
  const bg="background-color:#16245c;background-size:cover;background-position:center;";
  if(mode==='one'){
    const p=ps[k]||{n:''};
    return '<div style="position:absolute;left:60px;bottom:60px;display:flex;border:6px solid #ffc933;border-radius:28px;background:#0a1038;padding:14px;gap:24px;'+ff+'">'
     +'<div data-i="'+k+'" style="width:340px;height:420px;border-radius:16px;border:4px solid #ffc933;'+bg+'"></div>'
     +'<div style="display:flex;flex-direction:column;justify-content:center;min-width:560px;padding-right:30px;text-align:left">'
     +'<div style="color:#ffd21f;font-size:44px;font-weight:600">'+t+'</div>'
     +'<div style="color:#fff;font-size:110px;font-weight:700;line-height:1.25">'+p.n+'</div>'
     +'<div style="color:#d7ffb8;font-size:38px;font-weight:600">খেলোয়াড় নং '+(k+1)+'</div></div></div>';
  }
  const n=ps.length||1,gap=14,rows=Math.ceil(n/6),ph0=Math.min(300,Math.floor((860-gap*(rows-1))/rows)-76),w=Math.min(290,Math.round(ph0*1.05)),ph=Math.round(w/1.05),fs=Math.min(36,Math.floor(w/6.2));
  const cards=ps.map((p,i)=>'<div style="width:'+w+'px;border:4px solid #ffc933;border-radius:16px;padding:6px;background:#0a1038">'
    +'<div data-i="'+i+'" style="height:'+ph+'px;border-radius:8px;'+bg+'"></div>'
    +'<div style="margin-top:6px;background:#0b1670;border:3px solid #ffc933;border-radius:10px;color:#fff;font-size:'+fs+'px;font-weight:700;text-align:center;line-height:1.4;white-space:nowrap;overflow:hidden">'+(i+1)+'. '+p.n+'</div></div>').join('');
  return '<div style="position:absolute;left:40px;right:40px;bottom:50px;'+ff+'">'
   +'<div style="display:flex;justify-content:center;align-items:center;gap:20px;margin-bottom:14px">'
   +'<div style="background:#2a0508;border:6px solid #ffc933;border-radius:50px;color:#ffd21f;font-size:64px;font-weight:700;padding:0 50px;line-height:1.4">'+t+'</div>'
   +'<div style="background:#a00016;border:5px solid #ffc933;border-radius:40px;color:#fff;font-size:38px;font-weight:600;padding:2px 30px">'+lab+' '+m+'</div></div>'
   +'<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:'+gap+'px;width:'+(6*w+5*gap+2)+'px;margin:0 auto">'+cards+'</div></div>';
}
function paintImgs(el,d){el.querySelectorAll('[data-i]').forEach(x=>{const p=(d.ps||[])[+x.dataset.i];if(p&&p.i)x.style.backgroundImage='url("'+p.i+'")'})}
function mkOv(){
  const d=getData(),mode=$('omode').value,k=+$('oplayer').value||0;
  const el=document.createElement('div');el.id='ovtmp';
  el.style.cssText='position:fixed;left:-99999px;top:0;width:1920px;height:1080px;overflow:hidden';
  el.innerHTML=ovHtml(d,mode,k);document.body.appendChild(el);paintImgs(el,d);
  (document.fonts?document.fonts.ready:Promise.resolve()).then(()=>html2canvas(el,{backgroundColor:null,scale:1,width:1920,height:1080,onclone:x=>{x.getElementById('ovtmp').style.left='0'}}))
   .then(c=>{$('oimg').src=c.toDataURL('image/png');el.remove()})
   .catch(()=>el.remove());
  if(liveOn)pushCtl().catch(()=>{});
}
/* ---------- Firebase live sync ---------- */
let liveOn=false,ctl={show:false,mode:'team',idx:0,dv:0};
const dbu=()=>$('fdb').value.trim().replace(/\/+$/,'');
const rm=()=>$('froom').value.trim().replace(/[^\w-]/g,'');
const msg=x=>{$('fmsg').textContent=x};
function fput(path,obj){
  const u=dbu();
  if(!/^https:\/\//.test(u)||!rm()){msg('Firebase URL ও Room ID দিন');return Promise.reject(new Error('cfg'))}
  try{localStorage.setItem('tpm',JSON.stringify({db:u,room:rm()}))}catch(e){}
  return fetch(u+'/overlays/'+rm()+'/'+path+'.json',{method:'PUT',body:JSON.stringify(obj)}).then(r=>{if(!r.ok)throw new Error(r.status)});
}
function pushCtl(){ctl.mode=$('omode').value;ctl.idx=+$('oplayer').value||0;return fput('ctl',ctl)}
async function pushData(){
  msg('সিঙ্ক হচ্ছে…');
  try{await fput('data',getData());ctl.dv=Date.now();await pushCtl();msg('✔ ডেটা সিঙ্ক হয়েছে')}
  catch(e){if(e.message!=='cfg')msg('ব্যর্থ — Database URL ও Firebase rules চেক করুন')}
}
async function showLive(on){
  ctl.show=on;liveOn=true;
  try{if(on&&!ctl.dv)await pushData();await pushCtl();msg(on?'▶ লাইভ দেখানো হচ্ছে':'⏹ লুকানো হয়েছে')}
  catch(e){if(e.message!=='cfg')msg('ব্যর্থ — Database URL ও Firebase rules চেক করুন')}
}
function copyLink(){
  if(!/^https:\/\//.test(dbu())||!rm()){msg('Firebase URL ও Room ID দিন');return}
  const l=location.href.split('#')[0].split('?')[0]+'?o='+rm()+'&db='+encodeURIComponent(dbu());
  $('flink').value=l;
  try{navigator.clipboard.writeText(l)}catch(e){$('flink').select()}
  msg(location.protocol==='file:'?'⚠ লিংক কাজ করতে ফাইলটা GitHub Pages-এ আপলোড করে সেখান থেকে লিংক নিন':'✔ লিংক কপি হয়েছে — Prism-এ Web/Browser source-এ দিন');
}
function loadSaved(){
  try{const x=JSON.parse(localStorage.getItem('tpm')||'{}');if(x.db&&!$('fdb').value)$('fdb').value=x.db;if(x.room&&!$('froom').value)$('froom').value=x.room}catch(e){}
  if(!$('froom').value)$('froom').value='team-'+Math.random().toString(36).slice(2,8);
}
/* ---------- Overlay (Prism) mode ---------- */
function runOverlay(){
  document.documentElement.classList.add('ovm');
  const root=$('ovroot'),base=(Q.get('db')||'').replace(/\/+$/,'')+'/overlays/'+encodeURIComponent(OVM);
  root.style.display='block';
  const sc=()=>{root.style.transform='scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'};
  sc();addEventListener('resize',sc);
  let cur='',data=null,dv=0;
  async function tick(){
    try{
      const c=await(await fetch(base+'/ctl.json',{cache:'no-store'})).json();
      if(!c||!c.show){if(cur!==''){root.style.opacity=0;cur=''}return}
      if(c.dv!==dv||!data){data=await(await fetch(base+'/data.json',{cache:'no-store'})).json();dv=c.dv}
      if(!data)return;
      const key=JSON.stringify([c.mode,c.idx,dv]);
      if(key!==cur){cur=key;root.innerHTML=ovHtml(data,c.mode,+c.idx||0);paintImgs(root,data);root.style.opacity=1}
    }catch(e){}
  }
  tick();setInterval(tick,1500);
}
function dlOv(){
  const a=document.createElement('a');a.href=document.getElementById('oimg').src;
  const one=document.getElementById('omode').value==='one';
  a.download=one?'player-overlay.png':'team-overlay.png';a.click();
}
if(OVM)runOverlay();else{
names.forEach(n=>addP(n));
window.addEventListener('resize',fit);
document.fonts&&document.fonts.ready.then(fit);
}
</script>
</body>
</html>
